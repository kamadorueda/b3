[package]
authors = ["Kevin Amado <kamadorueda@gmail.com>"]
categories = []
description = "Reproducible builds, dev envs and deployments"
edition = "2021"
keywords = []
license = "AGPL-3.0-only"
name = "b3"
repository = "https://github.com/kamadorueda/b3"
version = "0.1.0"

[features]
default = []

[[bin]]
name = "b3"
required-features = []

[dependencies.clap]
version = "*"
default-features = false
features = ["std"]

[dependencies.log]
version = "*"
default-features = false
features = ["std"]

[dependencies.nixel]
default-features = false
features = []
version = "*"

[dev-dependencies.walkdir]
default-features = false
version = "*"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3

[profile.release.build-override]
codegen-units = 1
opt-level = 3
