[package]
authors = ["Kevin Amado <kamadorueda@gmail.com>"]
categories = []
description = "Reproducible builds, dev envs and deployments"
edition = "2021"
keywords = []
license = "AGPL-3.0-only"
name = "b3"
repository = "https://github.com/kamadorueda/b3"
version = "0.1.0"

[features]
default = []

[[bin]]
name = "b3"
required-features = []

[dependencies]
clap = { version = "*", default-features = false, features = [
  "error-context",
  "std"
] }
log = { version = "*", default-features = false, features = [] }
nixel = { version = "*", default-features = false, features = [] }

[dev-dependencies]
walkdir = { version = "*", default-features = false, features = [] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
build-override = { codegen-units = 1, opt-level = 3 }
package = { "*" = { codegen-units = 1, opt-level = 3 } }
